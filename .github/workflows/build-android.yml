# ============================================================
# DX Rename Android - workflow de build do APK
#
# COMO USAR: no site do GitHub, crie o arquivo
#   .github/workflows/build-android.yml
# e cole TODO o conteudo deste arquivo nele.
# (Este arquivo .txt fica na pasta android/ de proposito:
#  o push via API nao tem permissao de Workflows.)
#
# Igual ao workflow do DX Captura (verde): SDK 36 e Gradle 8.11.1.
# Sem wrapper no repo: o Gradle vem do setup-gradle.
# O workflow roda a partir da pasta android/ (working-directory).
# ============================================================

name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Testes do motor
        working-directory: android
        run: gradle testDebugUnitTest --console=plain

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --console=plain

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: dx-rename-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
